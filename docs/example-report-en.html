<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copilot &amp; Agent Readiness</title>
<style>
/* ---------- tokens: light first, dark under both the OS setting and the manual toggle ---------- */
:root{
  color-scheme:light;
  --plane:#f9f9f7;--surface:#fcfcfb;--surface-2:#f3f2ee;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--hair:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);
  --accent:#2a78d6;--accent-ink:#1c5cab;--accent-wash:rgba(42,120,214,.10);
  --good:#0ca30c;--warn:#fab219;--crit:#d03b3b;--na:#898781;
  --good-ink:#006300;--warn-ink:#7a4f00;--crit-ink:#a12626;--na-ink:#52514e;
  --good-wash:rgba(12,163,12,.13);--warn-wash:rgba(250,178,25,.20);--crit-wash:rgba(208,59,59,.12);--na-wash:rgba(137,135,129,.16);
  --radius:14px;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --shadow:0 1px 2px rgba(11,11,11,.04),0 8px 24px -16px rgba(11,11,11,.18);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;
  --plane:#0d0d0d;--surface:#1a1a19;--surface-2:#222221;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--hair:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
  --accent:#3987e5;--accent-ink:#86b6ef;--accent-wash:rgba(57,135,229,.16);
  --good-ink:#5fd35f;--warn-ink:#fac04a;--crit-ink:#ff8a8a;--na-ink:#c3c2b7;
  --good-wash:rgba(12,163,12,.22);--warn-wash:rgba(250,178,25,.22);--crit-wash:rgba(208,59,59,.22);--na-wash:rgba(137,135,129,.22);
  --shadow:none;
}}
:root[data-theme=dark]{
  color-scheme:dark;
  --plane:#0d0d0d;--surface:#1a1a19;--surface-2:#222221;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--hair:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
  --accent:#3987e5;--accent-ink:#86b6ef;--accent-wash:rgba(57,135,229,.16);
  --good-ink:#5fd35f;--warn-ink:#fac04a;--crit-ink:#ff8a8a;--na-ink:#c3c2b7;
  --good-wash:rgba(12,163,12,.22);--warn-wash:rgba(250,178,25,.22);--crit-wash:rgba(208,59,59,.22);--na-wash:rgba(137,135,129,.22);
  --shadow:none;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--plane);color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 64px}
.hidden{display:none!important}
.dim{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--radius);box-shadow:var(--shadow)}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h2{font-size:20px;font-weight:650}
h3{font-size:15px;font-weight:650}

/* ---------- status vocabulary ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap;line-height:1.4}
.pill i{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;font-style:normal;font-size:10px;font-weight:800;color:#fff;line-height:1}
.p-good{background:var(--good-wash);color:var(--good-ink)}.p-good i{background:var(--good)}
.p-warn{background:var(--warn-wash);color:var(--warn-ink)}.p-warn i{background:var(--warn);color:#2a1d00}
.p-crit{background:var(--crit-wash);color:var(--crit-ink)}.p-crit i{background:var(--crit)}
.p-na{background:var(--na-wash);color:var(--na-ink)}.p-na i{background:var(--na)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;vertical-align:middle}
.d-good{background:var(--good)}.d-warn{background:var(--warn)}.d-crit{background:var(--crit)}.d-na{background:var(--na)}
.tone-good{color:var(--good-ink)}.tone-warn{color:var(--warn-ink)}.tone-crit{color:var(--crit-ink)}.tone-na{color:var(--na-ink)}

/* meter: fill carries severity, the track is a lighter step of the same colour */
.meter{position:relative;height:10px;border-radius:4px;background:var(--na-wash);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:0 4px 4px 0;background:var(--na)}
.meter.s-good{background:var(--good-wash)}.meter.s-good i{background:var(--good)}
.meter.s-warn{background:var(--warn-wash)}.meter.s-warn i{background:var(--warn)}
.meter.s-crit{background:var(--crit-wash)}.meter.s-crit i{background:var(--crit)}
/* status stack: segments separated by a 2px surface gap */
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface)}
.stack i{display:block;height:100%;margin-right:2px}
.stack i:last-child{margin-right:0}
.stack .sg-good{background:var(--good)}.stack .sg-warn{background:var(--warn)}.stack .sg-crit{background:var(--crit)}.stack .sg-na{background:var(--na-wash)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- header ---------- */
header{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#7a3ae0);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em;flex:none}
.brand h1{font-size:22px;font-weight:700}
.brand .author{font-size:12px;color:var(--muted);margin-top:2px}.brand .author a{color:var(--ink2);text-decoration:underline;text-underline-offset:2px}.brand .author a:hover{color:var(--ink)}
.brand .sub{color:var(--ink2);font-size:13px;margin-top:1px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink2);font-size:12.5px;margin-top:10px}
.meta b{color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--ring);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.btn.link{border:0;background:none;color:var(--accent-ink);padding:2px 0;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--ring);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent-wash);color:var(--accent-ink);font-weight:650}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(280px,340px) 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.overall{padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;gap:10px}
.ringwrap{position:relative;width:156px;height:156px}
.ring circle{fill:none;stroke-width:12}
.ring .track{stroke:var(--na-wash)}.ring.s-good .track{stroke:var(--good-wash)}.ring.s-warn .track{stroke:var(--warn-wash)}.ring.s-crit .track{stroke:var(--crit-wash)}
.ring .fill{stroke:var(--na);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s ease}
.ring.s-good .fill{stroke:var(--good)}.ring.s-warn .fill{stroke:var(--warn)}.ring.s-crit .fill{stroke:var(--crit)}
.ringwrap .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .v b{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em}
.ringwrap .v small{color:var(--muted);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;margin-top:6px;max-width:96px;text-align:center;line-height:1.25}
.verdict{display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:700}
.overall p{margin:0;color:var(--ink2);font-size:13.5px;max-width:30ch}
.counts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--ink2)}
.counts b{color:var(--ink);font-weight:650}
.ladder{padding:20px 22px}
.ladder .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ladder .head p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.lrow{display:grid;grid-template-columns:34px minmax(150px,220px) 1fr 52px minmax(120px,150px);gap:14px;align-items:center;padding:9px 6px;border-radius:10px;cursor:pointer;text-decoration:none;color:inherit}
.lrow:hover{background:var(--surface-2)}
@media(max-width:700px){.lrow{grid-template-columns:34px 1fr 52px}.lrow .meter,.lrow .lst{grid-column:2/-1}}
.lrow .n{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:750;font-size:13px;color:var(--ink2)}
.lrow .t b{display:block;font-weight:650;font-size:14px}
.lrow .t span{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.lrow .meter{height:12px}
.lrow .sc{font-size:16px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.lrow .sc small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.lrow .lst{display:flex;flex-direction:column;gap:5px}
.lrow .lst .cnt{display:flex;gap:9px;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.lrow .lst .cnt span{display:inline-flex;align-items:center;gap:4px}

/* ---------- facts ---------- */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.fact{padding:12px 14px;cursor:pointer;transition:border-color .15s;text-decoration:none;color:inherit;display:block}
.fact:hover{border-color:var(--accent)}
.fact .l{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.fact .v{font-size:24px;font-weight:700;line-height:1.15;margin-top:3px;letter-spacing:-.01em}
.fact .s{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- top actions ---------- */
.top{margin-bottom:22px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.sechead p{margin:0;color:var(--ink2);font-size:13px}
.topgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.tcard{padding:14px 16px;display:grid;grid-template-columns:30px 1fr;gap:12px;cursor:pointer;transition:border-color .15s}
.tcard:hover{border-color:var(--accent)}
.tcard .idx{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:750;font-size:12.5px;color:var(--ink2)}
.tcard .ttl{font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tcard .ttl code{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.tcard .sum{color:var(--ink2);font-size:13px;margin-top:3px}
.tcard .fx{margin-top:8px;font-size:13px;padding-left:10px;border-left:3px solid var(--accent)}
.tcard .fx b{font-weight:650}

/* ---------- filter row ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px;position:sticky;top:0;z-index:5;background:var(--plane);padding:10px 0}
.filters input{flex:1 1 220px;min-width:180px;border:1px solid var(--ring);background:var(--surface);border-radius:999px;padding:7px 14px;font:inherit;color:inherit;outline:none}
.filters input:focus{border-color:var(--accent)}
.filters .sp{flex:1}

/* ---------- layout + nav ---------- */
.layout{display:grid;grid-template-columns:240px 1fr;gap:22px;align-items:start}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.nav{display:none}}
.nav{position:sticky;top:64px;padding:10px 6px;max-height:calc(100vh - 80px);overflow:auto;font-size:12.5px}
.nav a{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;padding:4px 10px;border-radius:8px}
.nav a:hover{background:var(--surface-2)}
.nav .e{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-top:10px;padding:4px 10px;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.nav .e:first-child{margin-top:0}
.nav .e b{color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}
.nav .cid{font-family:var(--mono);font-size:11px;color:var(--muted);width:28px;flex:none}
.nav .ct{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav hr{border:0;border-top:1px solid var(--hair);margin:8px 0}

/* ---------- area sections ---------- */
section.area{margin-bottom:28px;scroll-margin-top:70px}
    footer .credit{margin-top:10px;font-size:12px;color:var(--dim,#6b7280)}
    footer .credit a{color:inherit;text-decoration:underline}
.ehead{padding:18px 20px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
@media(max-width:700px){.ehead{grid-template-columns:1fr}}
.ehead .badge{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:16px;line-height:1}
.ehead .badge small{font-size:8.5px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:2px}
.ehead h2{font-size:19px}
.ehead .sub{color:var(--ink2);font-size:13px;margin-top:2px}
.ehead .right{display:flex;flex-direction:column;gap:6px;min-width:220px}
.ehead .right .sc{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink2)}
.ehead .right .sc b{font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.nomatch{padding:12px 16px;color:var(--muted);font-size:13px}

/* ---------- check cards ---------- */
.check{margin-bottom:8px;overflow:hidden;scroll-margin-top:70px}
.check .head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 16px;cursor:pointer;user-select:none}
.check .head:hover{background:var(--surface-2)}
.check .ttl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:650}
.check .ttl code{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.check .tags{display:inline-flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink2);font-weight:600;letter-spacing:.02em}
.check .sum{color:var(--ink2);font-size:13px;margin-top:2px}
.check .side{display:flex;align-items:center;gap:12px}
.check .msc{display:flex;flex-direction:column;align-items:flex-end;gap:3px;width:78px}
.check .msc .meter{width:78px;height:6px}
.check .msc small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.check .caret{color:var(--muted);font-size:11px;transition:transform .15s;width:12px;text-align:center}
.check.open .caret{transform:rotate(90deg)}
.check .body{display:none;border-top:1px solid var(--hair);padding:16px 18px 18px;background:color-mix(in srgb,var(--surface) 70%,var(--plane))}
.check.open .body{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.why{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:13.5px}
.why .k,.fix .k{margin-bottom:5px}
.fix{font-size:13.5px}
.fix .path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px}
.fix .path span{background:var(--surface-2);border-radius:6px;padding:1px 8px;font-size:12px;color:var(--ink2)}
.fix .path em{color:var(--muted);font-style:normal;font-size:11px}
.fix .links{margin-top:8px;font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.evh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:16px 0 6px;flex-wrap:wrap}
.evh .k{margin:0}
.evh small{color:var(--muted);font-size:12px}
.tw{overflow-x:auto;border:1px solid var(--hair);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--hair);vertical-align:top;word-break:break-word}
tr:last-child td{border-bottom:0}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650;white-space:nowrap;background:var(--surface-2);position:sticky;top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.bad td{background:var(--crit-wash)}
td .b{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-weight:600}
td .b i{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;font-style:normal;font-size:9px;font-weight:800;color:#fff}
.b.good{color:var(--good-ink)}.b.good i{background:var(--good)}.b.crit{color:var(--crit-ink)}.b.crit i{background:var(--crit)}.b.plain{color:var(--ink2);font-weight:500}.b.plain i{background:var(--axis)}
details.ids{display:inline}
details.ids summary{cursor:pointer;color:var(--accent-ink);font-weight:600;font-size:12.5px;list-style:none}
details.ids summary::-webkit-details-marker{display:none}
details.ids .mono{margin-top:4px;color:var(--ink2);white-space:pre-wrap}
.noev{color:var(--muted);font-size:13px;padding:8px 0}
.detail{font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:pre-wrap;margin-top:10px;background:var(--surface-2);padding:8px 10px;border-radius:8px}
.stepnav{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:13px}
.stepnav a{text-decoration:none;font-weight:600}

/* ---------- plan ---------- */
.plan{margin-top:34px}
.plan ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plan li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 14px;cursor:pointer}
.plan li:hover{border-color:var(--accent)}
.plan .no{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:750;font-size:12.5px;color:var(--ink2)}
.plan .pl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:650}
.plan .pl code{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.plan .pf{font-size:13px;margin-top:4px}
.plan .pp{font-size:12px;color:var(--muted);margin-top:3px}
.plan .eb{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 4px}
.plan .eb:first-child{margin-top:0}
.na-list{margin-top:22px;padding:14px 18px}
.na-list ul{margin:6px 0 0;padding-left:0;list-style:none;display:grid;gap:4px;font-size:13px;color:var(--ink2)}
.na-list li{display:grid;grid-template-columns:40px 1fr;gap:8px}
.na-list code{font-family:var(--mono);font-size:11px;color:var(--muted)}

.nowrap{white-space:nowrap}
.clk{cursor:pointer;border-radius:6px;transition:background .12s}
.clk:hover{background:var(--surface-2)}
.pill.clk:hover,.tag.clk:hover{filter:brightness(.95)}
.demo{display:flex;gap:10px;align-items:center;margin:0 0 16px;padding:10px 14px;border-radius:10px;border:1px dashed var(--hair);background:var(--surface-2);font-size:13px;color:var(--ink2)}
.demo b{color:var(--ink)}
.src{margin-top:8px;font-size:11.5px;color:var(--muted)}.src code{font-family:var(--mono);font-size:11px}
.proof{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all}
.na-list li{cursor:pointer}.na-list li:hover b{text-decoration:underline}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--hair);color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
.cta{background:var(--accent);color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:650;text-decoration:none}
.cta:hover{filter:brightness(1.08)}

/* ---------- print ---------- */
@media print{
  body{background:#fff;font-size:12px}
  .wrap{padding:0;max-width:none}
  .nav,.filters,.actions,.cta,.stepnav,.caret,.btn{display:none!important}
  .layout{grid-template-columns:1fr}
  .card{box-shadow:none;border-color:#ccc}
  .check .body{display:block!important}
  .check,.tcard,.fact,.plan li{break-inside:avoid}
  .hero{grid-template-columns:1fr 1fr}
  .tw{overflow:visible}
  th{position:static}
  a{color:inherit;text-decoration:none}
}

/* mobile */
.layout>*,.hero>*,.two>*,.check .head>*{min-width:0}
@media(max-width:640px){
  .wrap{padding:16px 14px 48px}
  .check .head{grid-template-columns:auto 1fr;gap:10px;padding:10px 12px}
  .check .side .msc{display:none}
  .check .head .side{grid-column:2;justify-self:end;margin-top:-4px}
  .topgrid{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,1fr)}
  .filters input[type=search]{flex:1 1 100%}
  .ringwrap{transform:scale(.9)}
  .meta{font-size:12px}
  .filters{position:static}
  .tw table{min-width:560px}
  .tw td{word-break:normal;overflow-wrap:anywhere}
}

/* ---------- v1 additions: grey states, coverage, preflight, 30/60/90 ---------- */
.meter.s-cov{background:var(--accent-wash)}.meter.s-cov i{background:var(--accent)}
.covline{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:4px}
.overall .cov{width:100%;max-width:260px}
.note{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;padding:10px 14px;border-radius:10px;border:1px dashed var(--hair);background:var(--surface-2);font-size:13px;color:var(--ink2)}
.note b{color:var(--ink)}
.note.strong{border-style:solid;border-color:var(--warn);background:var(--warn-wash);color:var(--ink)}
.capcard{padding:16px 18px;margin-bottom:16px}
.capcard .two{margin-top:10px}
.capcard td.r{white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips span{background:var(--surface-2);border-radius:6px;padding:1px 8px;font-size:12px;color:var(--ink2)}
.plancols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media(max-width:1100px){.plancols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.plancols{grid-template-columns:1fr}}
.pcol{padding:12px 12px 6px}
.pcol h3{font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between}
.pcol h3 span{color:var(--muted);font-weight:600}
.pitem{padding:8px 8px;border-radius:8px;cursor:pointer;margin-bottom:6px;background:var(--surface-2)}
.pitem:hover{outline:1px solid var(--accent)}
.pitem .pt{font-weight:650;font-size:13px;display:flex;gap:6px;align-items:baseline}
.pitem .pt code{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.pitem .pm{font-size:12px;color:var(--ink2);margin-top:2px}
.tag.prev{background:var(--warn-wash);color:var(--warn-ink)}
.tag.uns{background:var(--na-wash);color:var(--na-ink)}
.statecount{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--ink2)}
.statecount span{display:inline-flex;gap:5px;align-items:center}
.quiet{color:var(--muted);font-size:12.5px;text-decoration:none}
.quiet:hover{color:var(--ink)}
footer .method{max-width:820px}
</style>
</head>

ups.","fix_de":"Lizenzen über eine Entra-Gruppe zuweisen. Erst eine Pilotgruppe, dann erweitern.","fix_en":"Assign licences through an Entra group. Start with a pilot group, then widen.","path":"Microsoft 365 Admin Center → Billing → Licenses","docs":"https://learn.microsoft.com/microsoft-365/copilot/microsoft-365-copilot-licensing","source":"GET /subscribedSkus · GET /users (assignedLicenses, licenseAssignmentStates)"},{"id":"S02","area":"oversharing","weight":1,"scored":false,"reader":"graph","scopes":["Reports.Read.All"],"effort":"S","license":"Microsoft 365 Copilot","title_de":"Copilot-Nutzung (Adoption, nicht bewertet)","title_en":"Copilot usage (adoption, not scored)","why_de":"Zeigt, wo Copilot wirklich genutzt wird. Dort entstehen Prompts, Antworten und Audit-Daten. Nutzung ist keine Sicherheitsaussage und fließt nicht in den Score.","why_en":"Shows where Copilot is really used. That is where prompts, answers and audit data appear. Usage is not a security statement and does not count in the score.","fix_de":"Nutzung dort ausbauen, wo Oversharing und Datenschutz bereits geklärt sind. Copilot Chat ohne Lizenz ist hier nicht enthalten.","fix_en":"Grow usage where oversharing and data protection are already settled. Copilot Chat without a licence is not included here.","path":"Microsoft 365 Admin Center → Reports → Usage → Microsoft 365 Copilot","docs":"https://learn.microsoft.com/microsoft-365/copilot/extensibility/api/admin-settings/reports/copilotreportroot-getmicrosoft365copilotusageuserdetail","source":"GET beta/copilot/reports/getMicrosoft365CopilotUsageUserDetail(period='D28')"},{"id":"S03","area":"oversharing","weight":3,"scored":true,"reader":"graph","scopes":["SharePointTenantSettings.Read.All"],"effort":"S","license":"—","title_de":"Externe Freigabe auf Tenant-Ebene","title_en":"Tenant-level external sharing","why_de":"„Jeder“-Links öffnen Dateien für alle, die den Link haben. Was so geteilt ist, kann ein Agent oder Copilot weiterreichen, ohne dass jemand fragt, wer es sehen darf.","why_en":"Anyone links open files to whoever holds the link. Content shared this way can be passed on by an agent or Copilot without anyone asking who may see it.","fix_de":"Freigabe auf „Neue und bestehende Gäste“ oder strenger setzen. „Jeder“-Links nur mit Ablaufdatum.","fix_en":"Set sharing to new and existing guests or stricter. Anyone links only with an expiry date.","path":"SharePoint Admin Center → Policies → Sharing","docs":"https://learn.microsoft.com/sharepoint/turn-external-sharing-on-or-off","source":"GET /admin/sharepoint/settings"},{"id":"S04","area":"oversharing","weight":1,"scored":true,"reader":"graph","scopes":["SharePointTenantSettings.Read.All"],"effort":"S","license":"—","title_de":"Freigabe-Hygiene","title_en":"Sharing hygiene","why_de":"Weiterteilen durch Gäste, alte Protokolle und Sync auf private Geräte vergrößern die Datenmenge, die außerhalb Ihrer Kontrolle liegt und trotzdem von KI gefunden wird.","why_en":"Re-sharing by guests, old protocols and sync to private devices grow the amount of data outside your control that AI still finds.","fix_de":"Weiterteilen durch Gäste aus, Legacy-Authentifizierung aus, Sync nur von verwalteten Geräten.","fix_en":"Turn off guest re-sharing and legacy authentication; allow sync only from managed devices.","path":"SharePoint Admin Center → Policies → Sharing / Access control","docs":"https://learn.microsoft.com/sharepoint/control-access-from-unmanaged-devices","source":"GET /admin/sharepoint/settings"},{"id":"S05","area":"oversharing","weight":3,"scored":true,"reader":"graph","scopes":["Directory.Read.All"],"effort":"M","license":"—","title_de":"Öffentliche Microsoft-365-Gruppen und Teams","title_en":"Public Microsoft 365 groups and Teams","why_de":"In öffentliche Gruppen kann jede Person im Unternehmen eintreten. Ihre Dateien sind damit für Copilot-Antworten praktisch aller Nutzer erreichbar.","why_en":"Anyone in the company can join a public group. Its files are therefore within reach of Copilot answers for practically every user.","fix_de":"Gruppen mit sensiblen Inhalten auf „Privat“ stellen und Owner bestätigen lassen. Neue Gruppen standardmäßig privat.","fix_en":"Set groups with sensitive content to Private and have owners confirm. Make new groups private by default.","path":"Microsoft 365 Admin Center → Teams & groups → Active teams & groups","docs":"https://learn.microsoft.com/microsoft-365/copilot/microsoft-365-copilot-blueprint-oversharing","source":"GET /groups?$filter=groupTypes/any(c:c eq 'Unified')"},{"id":"S06","area":"oversharing","weight":2,"scored":true,"reader":"graph","scopes":["Directory.Read.All"],"effort":"M","license":"—","title_de":"Gruppen ohne Owner","title_en":"Groups without an owner","why_de":"Ohne Owner entscheidet niemand, wer die Inhalte sehen darf. Oversharing bleibt bestehen, und KI zeigt die Inhalte weiter an.","why_en":"Without an owner nobody decides who may see the content. Oversharing stays, and AI keeps surfacing it.","fix_de":"Owner nachbesetzen oder Gruppe archivieren. Richtlinie für Gruppen ohne Owner aktivieren.","fix_en":"Assign a new owner or archive the group. Turn on the ownerless group policy.","path":"Microsoft 365 Admin Center → Settings → Org settings → Microsoft 365 Groups","docs":"https://learn.microsoft.com/microsoft-365/solutions/microsoft-365-groups-ownerless-groups","source":"POST /$batch → GET /groups/{id}/owners (read-only sub-requests)"},{"id":"S07","area":"oversharing","weight":2,"scored":true,"reader":"graph","scopes":["Reports.Read.All","ReportSettings.Read.All"],"effort":"M","license":"—","title_de":"Inaktive SharePoint-Sites","title_en":"Inactive SharePoint sites","why_de":"Alte Sites enthalten veraltete Informationen. Copilot und Agents präsentieren sie trotzdem als Antwort.","why_en":"Old sites hold outdated information. Copilot and agents still present it as an answer.","fix_de":"Richtlinie für inaktive Sites einrichten. Archivieren statt liegen lassen.","fix_en":"Set up an inactive site policy. Archive instead of leaving sites around.","path":"SharePoint Admin Center → Site lifecycle management","docs":"https://learn.microsoft.com/sharepoint/site-lifecycle-management","source":"GET /reports/getSharePointSiteUsageDetail(period='D180') · GET /admin/reportSettings"},{"id":"S08","area":"oversharing","weight":1,"scored":true,"reader":"graph","scopes":["Reports.Read.All"],"effort":"S","license":"—","title_de":"Externe Freigaben pro Nutzer (Aktivität)","title_en":"External sharing per user (activity)","why_de":"Wer viel extern teilt, schafft Gastzugriffe. Was Copilot daraus zusammenfasst, landet schneller bei Empfängern außerhalb.","why_en":"Heavy external sharers create guest access. What Copilot summarises from it reaches outside recipients faster.","fix_de":"Top-Nutzer ansprechen und Gastzugriffe regelmäßig prüfen. Dies ist ein Aktivitätswert, keine Liste aktiver Links.","fix_en":"Talk to the top sharers and review guest access regularly. This is activity, not a list of active links.","path":"SharePoint Admin Center → Reports → Data access governance","docs":"https://learn.microsoft.com/graph/api/reportroot-getsharepointactivityuserdetail","source":"GET /reports/getSharePointActivityUserDetail(period='D30')"},{"id":"S09","area":"oversharing","weight":2,"scored":true,"reader":"graph","scopes":["Directory.Read.All","AuditLog.Read.All"],"effort":"M","license":"Entra ID P1 (Anmeldeaktivität)","license_en":"Entra ID P1 (sign-in activity)","title_de":"Gäste ohne Aktivität","title_en":"Inactive guests","why_de":"Inaktive Gäste behalten Zugriff auf Sites und Teams. Ein übernommenes Gastkonto mit Copilot-Zugang findet dort alles Freigegebene.","why_en":"Inactive guests keep access to sites and Teams. A taken-over guest account finds everything shared there.","fix_de":"Access Reviews für Gäste einrichten oder vierteljährlich bereinigen.","fix_en":"Set up access reviews for guests or clean up every quarter.","path":"Entra Admin Center → Identity Governance → Access reviews","docs":"https://learn.microsoft.com/entra/id-governance/access-reviews-overview","source":"GET /users?$filter=userType eq 'Guest' (signInActivity)"},{"id":"S11","area":"oversharing","weight":2,"scored":true,"reader":"sharepoint","scopes":[],"effort":"M","preview":false,"license":"Microsoft 365 Copilot + SharePoint Advanced Management","title_de":"Restricted Content Discovery und Restricted Access Control je Site","title_en":"Restricted Content Discovery and Restricted Access Control per site","why_de":"RCD nimmt eine Site aus der organisationsweiten Suche und aus Copilot heraus, ändert aber keine Berechtigung. RAC begrenzt den Zugriff tatsächlich auf Gruppen. Beides zeigt, wo sensible Sites vor KI geschützt sind.","why_en":"RCD takes a site out of organisation-wide search and Copilot but changes no permission. RAC really limits access to groups. Both show where sensitive sites are shielded from AI.","fix_de":"RCD gezielt für sensible Sites während der Bereinigung nutzen, nicht flächendeckend. Für echte Grenzen RAC mit passenden Gruppen setzen.","fix_en":"Use RCD for selected sensitive sites while you clean up, not everywhere. For a real boundary set RAC with the right groups.","path":"SharePoint Admin Center → Sites → Active sites → Settings","docs":"https://learn.microsoft.com/sharepoint/restricted-content-discovery","source":"Get-SPOSite -Limit All (RestrictContentOrgWideSearch, RestrictedAccessControl, RestrictedAccessControlGroups)"},{"id":"S12","area":"oversharing","weight":2,"scored":true,"reader":"sharepoint","scopes":[],"effort":"M","license":"SharePoint Advanced Management (oder Copilot-Lizenz)","license_en":"SharePoint Advanced Management (or Copilot licence)","title_de":"Oversharing-Berichte (Data access governance): vorhanden und aktuell","title_en":"Oversharing reports (data access governance): present and current","why_de":"Die DAG-Berichte zeigen, welche Sites sehr viele Personen erreichen oder mit „Jeder außer externen Benutzern“ geteilt sind. Ohne aktuellen Bericht weiß niemand, was Copilot breit sichtbar macht.","why_en":"DAG reports show which sites reach very many people or are shared with Everyone except external users. Without a current report nobody knows what Copilot makes widely visible.","fix_de":"Bericht „Site-Berechtigungen“ alle 30 Tage erzeugen und die Top-Sites mit Site-Access-Reviews bereinigen. Dieses Tool startet selbst keinen Bericht.","fix_en":"Create the site permissions report every 30 days and clean up the top sites with site access reviews. This tool never starts a report itself.","path":"SharePoint Admin Center → Reports → Data access governance","docs":"https://learn.microsoft.com/sharepoint/data-access-governance-reports","source":"Get-SPODataAccessGovernanceInsight -ReportEntity <entity> (existing reports only)"},{"id":"K01","area":"data","weight":3,"scored":true,"reader":"graph","scopes":["SensitivityLabel.Read","InformationProtectionPolicy.Read"],"effort":"M","license":"Microsoft 365 E3/E5 oder Business Premium","license_en":"Microsoft 365 E3/E5 or Business Premium","title_de":"Sensitivity Labels im Tenant","title_en":"Sensitivity labels in the tenant","why_de":"Copilot beachtet Labels: verschlüsselte Inhalte fließen nur mit passendem Nutzungsrecht in Antworten, neue Inhalte erben das Label der Quelle. Ohne Labels gibt es nichts zu beachten und nichts zu erben.","why_en":"Copilot respects labels: encrypted content only enters answers with the right usage rights, and new content inherits the source label. Without labels there is nothing to respect or inherit.","fix_de":"Eine kleine Label-Struktur (z. B. Öffentlich, Intern, Vertraulich, Streng vertraulich) anlegen und veröffentlichen.","fix_en":"Create and publish a small label set (for example Public, Internal, Confidential, Highly confidential).","path":"Purview → Information Protection → Sensitivity labels","docs":"https://learn.microsoft.com/purview/sensitivity-labels","source":"GET /security/dataSecurityAndGovernance/sensitivityLabels (fallback: beta /me/security/informationProtection/sensitivityLabels)"},{"id":"K02","area":"data","weight":2,"scored":true,"reader":"graph","scopes":["SensitivityLabel.Read","InformationProtectionPolicy.Read"],"effort":"M","license":"Microsoft 365 E3/E5 oder Business Premium","license_en":"Microsoft 365 E3/E5 or Business Premium","title_de":"Labels für Teams, Gruppen und Sites","title_en":"Labels for Teams, groups and sites","why_de":"Container-Labels steuern Privatsphäre, Gastzugriff und Freigabe einer ganzen Site. Damit wird Schutz für KI am Ort der Daten festgelegt, nicht Datei für Datei.","why_en":"Container labels control privacy, guest access and sharing for a whole site. Protection for AI is then set where the data lives, not file by file.","fix_de":"Label-Bereich um „Gruppen und Sites“ erweitern und ein Standard-Label für neue Teams festlegen.","fix_en":"Extend the label scope to groups and sites and set a default label for new Teams.","path":"Purview → Information Protection → Sensitivity labels → Scope","docs":"https://learn.microsoft.com/purview/sensitivity-labels-teams-groups-sites","source":"Same label read as K01 (applicableTo / contentFormats)"},{"id":"K03","area":"data","weight":2,"scored":true,"reader":"purview","scopes":[],"effort":"S","license":"Microsoft 365 E3/E5 oder Business Premium","license_en":"Microsoft 365 E3/E5 or Business Premium","title_de":"Label-Richtlinie: Standard-Label und Pflicht","title_en":"Label policy: default label and mandatory labelling","why_de":"Ohne Standard-Label bleiben neue Dokumente ohne Klassifizierung. Genau diese Dokumente nutzt Copilot am häufigsten.","why_en":"Without a default label new documents stay unclassified. Those are exactly the documents Copilot uses most.","fix_de":"In einer aktiven Richtlinie ein Standard-Label setzen und Pflicht-Labeling einschalten.","fix_en":"Set a default label and turn on mandatory labelling in an enabled policy.","path":"Purview → Information Protection → Label policies","docs":"https://learn.microsoft.com/purview/sensitivity-labels-office-apps","source":"Get-LabelPolicy (Security & Compliance PowerShell)"},{"id":"K04","area":"data","weight":2,"scored":true,"reader":"purview","scopes":[],"plans":["MIP_S_CLP2"],"effort":"L","license":"Microsoft 365 E5 / Purview Suite","title_de":"Automatische Label-Vergabe","title_en":"Automatic labelling","why_de":"Bestandsdaten werden nie von Hand nachklassifiziert. Automatische Labels sind der Weg, Altbestände für KI zu kennzeichnen.","why_en":"Existing data is never classified by hand. Automatic labelling is the way to mark legacy content for AI.","fix_de":"Dienstseitiges Auto-Labeling für SharePoint und OneDrive zuerst im Simulationsmodus starten, dann erzwingen.","fix_en":"Start service-side auto-labelling for SharePoint and OneDrive in simulation, then enforce.","path":"Purview → Information Protection → Auto-labeling","docs":"https://learn.microsoft.com/purview/apply-sensitivity-label-automatically","source":"Get-AutoSensitivityLabelPolicy (Security & Compliance PowerShell)"},{"id":"K05","area":"data","weight":2,"scored":true,"reader":"sharepoint","scopes":[],"effort":"M","license":"SharePoint Advanced Management (oder Copilot-Lizenz)","license_en":"SharePoint Advanced Management (or Copilot licence)","title_de":"Labels auf echten Inhalten (DAG-Label-Bericht)","title_en":"Labels on real content (DAG label report)","why_de":"Drei angelegte Labels sagen nichts darüber, ob Dateien gelabelt sind. Nur ein Bericht über gelabelte Dateien zeigt, ob der Schutz die Inhalte erreicht, die Copilot liest.","why_en":"Three created labels say nothing about whether files are labelled. Only a report on labelled files shows if protection reaches the content Copilot reads.","fix_de":"DAG-Bericht „Sensitivity labels in files“ für die wichtigsten Labels erzeugen und mit dem Label-Rollout vergleichen. OneDrive wird von diesem Bericht nicht abgedeckt.","fix_en":"Create the DAG report on sensitivity labels in files for the main labels and compare it with the label rollout. OneDrive is not covered by this report.","path":"SharePoint Admin Center → Reports → Data access governance → Sensitivity labels","docs":"https://learn.microsoft.com/sharepoint/data-access-governance-sensitivity-label-report","source":"Get-SPODataAccessGovernanceInsight -ReportEntity SensitivityLabelForFiles (existing reports only)"},{"id":"K06","area":"data","weight":1,"scored":true,"reader":"graph","scopes":["RecordsManagement.Read.All"],"effort":"M","license":"Microsoft 365 E3/E5","title_de":"Aufbewahrungs-Labels","title_en":"Retention labels","why_de":"Was gelöscht werden darf, sollte weg sein, bevor Copilot es als Quelle nutzt.","why_en":"What may be deleted should be gone before Copilot uses it as a source.","fix_de":"Aufbewahrungs-Labels für die wichtigsten Dokumentarten anlegen und veröffentlichen.","fix_en":"Create and publish retention labels for the main document types.","path":"Purview → Data Lifecycle Management → Retention labels","docs":"https://learn.microsoft.com/purview/retention","source":"GET beta/security/labels/retentionLabels"},{"id":"B01","area":"data","weight":2,"scored":true,"reader":"purview","scopes":[],"effort":"M","preview":true,"license":"Copilot / Copilot Chat (laut Microsoft auch E3 und Business)","license_en":"Copilot / Copilot Chat (per Microsoft also E3 and Business)","title_de":"DLP für Copilot: sensible Daten in Prompts","title_en":"DLP for Copilot: sensitive data in prompts","why_de":"Nutzer kopieren Kundendaten, IBANs oder Gesundheitsdaten in Prompts. Eine DLP-Regel am Copilot-Speicherort kann solche Prompts erkennen und blockieren.","why_en":"Users paste customer data, bank details or health data into prompts. A DLP rule at the Copilot location can detect and block such prompts.","fix_de":"DLP-Richtlinie mit Speicherort „Microsoft 365 Copilot“ und Bedingung „enthält vertrauliche Informationen“ anlegen, zuerst im Testmodus.","fix_en":"Create a DLP policy for the Microsoft 365 Copilot location with a sensitive information type condition, first in test mode.","path":"Purview → Data Loss Prevention → Policies","docs":"https://learn.microsoft.com/purview/dlp-microsoft365-copilot-location-learn-about","source":"Get-DlpCompliancePolicy · Get-DlpComplianceRule (Security & Compliance PowerShell)"},{"id":"B05","area":"data","weight":2,"scored":true,"reader":"purview","scopes":[],"effort":"M","license":"Microsoft 365 E5 / Purview Suite","title_de":"DLP für Copilot: gelabelte Dateien und Mails","title_en":"DLP for Copilot: labelled files and emails","why_de":"Hier sagen Sie Copilot: Inhalte mit diesem Label nicht verarbeiten. Das schützt „Streng vertraulich“ auch dann, wenn die Berechtigungen zu weit sind.","why_en":"This is where you tell Copilot: do not process content with this label. It protects highly confidential content even when permissions are too wide.","fix_de":"DLP-Regel am Copilot-Speicherort mit Bedingung Sensitivity Label und Aktion „Verarbeitung ausschließen“ anlegen.","fix_en":"Create a DLP rule at the Copilot location with a sensitivity label condition and the action to exclude content processing.","path":"Purview → Data Loss Prevention → Policies","docs":"https://learn.microsoft.com/purview/dlp-microsoft365-copilot-location-learn-about","source":"Get-DlpCompliancePolicy · Get-DlpComplianceRule (Security & Compliance PowerShell)"},{"id":"B02","area":"data","weight":2,"scored":true,"reader":"purview","scopes":[],"effort":"M","license":"Microsoft 365 E3/E5 (Teams/Endpoint je nach Lizenz)","license_en":"Microsoft 365 E3/E5 (Teams/Endpoint depending on licence)","title_de":"DLP-Abdeckung der Ausgänge","title_en":"DLP coverage of exits","why_de":"Was Copilot zusammenfasst, kann sofort per Mail, Teams oder Freigabe weitergehen. DLP muss diese Ausgänge abdecken.","why_en":"What Copilot summarises can leave at once by mail, Teams or sharing. DLP has to cover those exits.","fix_de":"Mindestens Exchange, SharePoint und OneDrive mit aktiver DLP abdecken. Teams und Endpoint je nach Lizenz ergänzen.","fix_en":"Cover at least Exchange, SharePoint and OneDrive with enforced DLP. Add Teams and endpoints where licensed.","path":"Purview → Data Loss Prevention → Policies","docs":"https://learn.microsoft.com/purview/dlp-learn-about-dlp","source":"Get-DlpCompliancePolicy (Security & Compliance PowerShell)"},{"id":"A01","area":"agents","weight":3,"scored":true,"reader":"graph","scopes":["AgentIdentity.Read.All"],"effort":"M","license":"— (Entra Agent ID)","title_de":"Agent-Identitäten mit Verantwortlichen","title_en":"Agent identities with accountable owners","why_de":"Agents mit eigener Identität greifen auf Daten zu und handeln selbständig. Ohne Owner oder Sponsor pflegt niemand die Berechtigungen, wenn die Person geht, die den Agent gebaut hat.","why_en":"Agents with their own identity access data and act on their own. Without an owner or sponsor nobody maintains their permissions when the builder leaves.","fix_de":"Für jede aktive Agent-Identität einen Owner oder Sponsor eintragen. Nicht mehr genutzte Agents deaktivieren.","fix_en":"Record an owner or sponsor for every active agent identity. Disable agents nobody uses any more.","path":"Entra Admin Center → Agent ID → All agent identities","docs":"https://learn.microsoft.com/graph/api/agentidentity-list?view=graph-rest-1.0","source":"GET /servicePrincipals/microsoft.graph.agentIdentity · GET /servicePrincipals/{id}/owners"},{"id":"A02","area":"agents","weight":3,"scored":true,"reader":"ppapi","scopes":[],"effort":"M","preview":true,"license":"Copilot Studio / Power Platform","title_de":"Agents: Freigabe, Anmeldung und Maker-Verbindungen","title_en":"Agents: sharing, sign-in and maker connections","why_de":"Ein Agent, der für den ganzen Tenant geteilt ist oder ohne Anmeldung läuft, gibt sein Wissen und seine Aktionen an alle weiter. Mit Maker-Verbindung handelt er mit den Rechten der Person, die ihn gebaut hat.","why_en":"An agent shared with the whole tenant or running without sign-in gives its knowledge and actions to everyone. With a maker connection it acts with the rights of the person who built it.","fix_de":"Tenant-weite Freigabe nur nach Prüfung. Anmeldung mit Microsoft Entra erzwingen. Maker-Verbindungen durch Nutzer-Verbindungen ersetzen.","fix_en":"Share tenant-wide only after review. Require Microsoft Entra sign-in. Replace maker connections with user connections.","path":"Power Platform Admin Center → Manage → Copilot Studio","docs":"https://learn.microsoft.com/microsoft-copilot-studio/admin-agent-inventory","source":"POST https://api.powerplatform.com/resourcequery/resources/query?api-version=2024-10-01 (read query, delegated)"},{"id":"A03","area":"agents","weight":2,"scored":true,"reader":"powerplatform","scopes":[],"effort":"M","license":"Power Platform / Copilot Studio","title_de":"Power-Platform-DLP für Agent-Umgebungen","title_en":"Power Platform DLP for agent environments","why_de":"Agents nutzen Konnektoren. Ohne DLP-Richtlinie für die Umgebung kann ein Agent Unternehmensdaten mit beliebigen externen Diensten verbinden. Diese DLP ist nicht die Purview-DLP.","why_en":"Agents use connectors. Without a DLP policy for the environment an agent can connect company data to any external service. This DLP is not Purview DLP.","fix_de":"Eine Richtlinie für alle Umgebungen (inkl. Standard-Umgebung) mit getrennten Gruppen „Business“ und „Non-Business“ und blockierten Konnektoren anlegen.","fix_en":"Create a policy for all environments (including the default one) with separate Business and Non-business groups and blocked connectors.","path":"Power Platform Admin Center → Security → Data and privacy → Data policies","docs":"https://learn.microsoft.com/microsoft-copilot-studio/admin-data-loss-prevention","source":"Get-AdminDlpPolicy · Get-AdminPowerAppEnvironment (Microsoft.PowerApps.Administration.PowerShell)"},{"id":"Z01","area":"identity","weight":3,"scored":true,"reader":"graph","scopes":["Policy.Read.All"],"effort":"M","license":"Entra ID P1 (oder Security Defaults)","license_en":"Entra ID P1 (or Security Defaults)","title_de":"MFA für alle Nutzer per Conditional Access","title_en":"MFA for all users via Conditional Access","why_de":"Ein übernommenes Konto mit Copilot findet in Minuten, wofür ein Angreifer früher Wochen brauchte.","why_en":"A taken-over account with Copilot finds in minutes what an attacker used to need weeks for.","fix_de":"CA-Richtlinie: alle Nutzer, alle Ressourcen, MFA oder Authentifizierungsstärke. Nur Notfallkonten ausnehmen.","fix_en":"CA policy: all users, all resources, MFA or authentication strength. Exclude emergency accounts only.","path":"Entra Admin Center → Protection → Conditional Access","docs":"https://learn.microsoft.com/entra/identity/conditional-access/policy-all-users-mfa-strength","source":"GET /identity/conditionalAccess/policies · GET /policies/identitySecurityDefaultsEnforcementPolicy"},{"id":"Z02","area":"identity","weight":2,"scored":true,"reader":"graph","scopes":["Policy.Read.All"],"effort":"S","license":"Entra ID P1 (oder Security Defaults)","license_en":"Entra ID P1 (or Security Defaults)","title_de":"Legacy-Authentifizierung blockiert","title_en":"Legacy authentication blocked","why_de":"Alte Protokolle umgehen MFA. Ein Passwort reicht dann für den Zugriff auf Mails und Dateien, die auch KI nutzt.","why_en":"Old protocols bypass MFA. A password is then enough to reach mail and files that AI also uses.","fix_de":"CA-Richtlinie: alle Nutzer, Client-Apps „Exchange ActiveSync“ und „Andere Clients“ blockieren.","fix_en":"CA policy: all users, block client apps Exchange ActiveSync and Other clients.","path":"Entra Admin Center → Protection → Conditional Access","docs":"https://learn.microsoft.com/entra/identity/conditional-access/policy-block-legacy-authentication","source":"GET /identity/conditionalAccess/policies"},{"id":"Z03","area":"identity","weight":2,"scored":true,"reader":"graph","scopes":["Policy.Read.All"],"plans":["AAD_PREMIUM","AAD_PREMIUM_P2"],"effort":"L","license":"Entra ID P1 + Intune","title_de":"Verwaltetes Gerät für Microsoft 365","title_en":"Managed device for Microsoft 365","why_de":"Ohne Geräteregel können Copilot-Antworten mit vertraulichem Inhalt auf private, unverwaltete Geräte gelangen.","why_en":"Without a device rule, Copilot answers with confidential content can reach private, unmanaged devices.","fix_de":"CA-Richtlinie: Office 365 nur von konformen oder Hybrid-verbundenen Geräten.","fix_en":"CA policy: Office 365 only from compliant or hybrid-joined devices.","path":"Entra Admin Center → Protection → Conditional Access","docs":"https://learn.microsoft.com/entra/identity/conditional-access/policy-all-users-device-compliance","source":"GET /identity/conditionalAccess/policies"},{"id":"Z04","area":"identity","weight":2,"scored":true,"reader":"graph","scopes":["AuditLog.Read.All"],"effort":"M","license":"Entra ID P1 (Bericht)","license_en":"Entra ID P1 (report)","title_de":"MFA-Registrierung","title_en":"MFA registration","why_de":"Eine MFA-Regel ohne registrierte Methoden sperrt Nutzer aus oder wird aufgeweicht. Registrierung ist noch keine Durchsetzung.","why_en":"An MFA rule without registered methods locks users out or gets watered down. Registration is not yet enforcement.","fix_de":"Registrierungskampagne für den Authenticator oder Passkeys starten.","fix_en":"Run a registration campaign for Authenticator or passkeys.","path":"Entra Admin Center → Protection → Authentication methods","docs":"https://learn.microsoft.com/entra/identity/authentication/how-to-mfa-registration-campaign","source":"GET /reports/authenticationMethods/userRegistrationDetails"},{"id":"Z05","area":"identity","weight":2,"scored":true,"reader":"graph","scopes":["RoleManagement.Read.Directory","Directory.Read.All"],"effort":"S","license":"—","title_de":"Globale Administratoren","title_en":"Global Administrators","why_de":"Ein Global Admin mit Copilot-Lizenz findet in Sekunden alles im Tenant. Für Angreifer ist das das wertvollste Konto.","why_en":"A Global Admin with a Copilot licence finds everything in the tenant in seconds. For attackers that is the most valuable account.","fix_de":"2 bis 5 Global Admins, eigene Admin-Konten ohne Copilot und ohne Postfach.","fix_en":"2 to 5 Global Admins, separate admin accounts without Copilot and without a mailbox.","path":"Entra Admin Center → Roles & admins","docs":"https://learn.microsoft.com/entra/identity/role-based-access-control/best-practices","source":"GET /directoryRoles · GET /directoryRoles/{id}/members"},{"id":"Z06","area":"identity","weight":1,"scored":true,"reader":"graph","scopes":["Policy.Read.All"],"effort":"S","license":"—","title_de":"Gast-Einladungen und Gastrolle","title_en":"Guest invitations and guest role","why_de":"Wenn jeder Gäste einladen darf, wächst der Personenkreis unkontrolliert, der auf geteilte Inhalte zugreifen kann.","why_en":"If anyone can invite guests, the circle of people who can reach shared content grows without control.","fix_de":"Einladungen nur durch Admins und Gast-Einlader. Gastrolle „eingeschränkt“.","fix_en":"Invitations by admins and guest inviters only. Guest role restricted.","path":"Entra Admin Center → External Identities → External collaboration settings","docs":"https://learn.microsoft.com/entra/external-id/external-collaboration-settings-configure","source":"GET /policies/authorizationPolicy"},{"id":"Z07","area":"identity","weight":2,"scored":true,"reader":"graph","scopes":["Policy.Read.All"],"effort":"S","license":"—","title_de":"Wer Apps und Agents Zugriff geben darf","title_en":"Who may grant apps and agents access","why_de":"Wenn Nutzer selbst Apps registrieren oder ihnen Zugriff erlauben, entstehen Apps und Agents, die mit Nutzerrechten auf Mails und Dateien zugreifen, ohne dass IT davon weiß.","why_en":"When users register apps or consent to them, apps and agents appear that read mail and files with user rights, without IT knowing.","fix_de":"App-Registrierung durch Nutzer ausschalten. Nutzer-Zustimmung nur für verifizierte Herausgeber mit geringen Rechten, sonst Admin-Workflow.","fix_en":"Turn off app registration by users. Allow user consent only for verified publishers with low-impact permissions, otherwise use the admin workflow.","path":"Entra Admin Center → Enterprise applications → Consent and permissions","docs":"https://learn.microsoft.com/entra/identity/enterprise-apps/configure-user-consent","source":"GET /policies/authorizationPolicy"},{"id":"I01","area":"identity","weight":2,"scored":true,"reader":"graph","scopes":["Policy.Read.All"],"plans":["AAD_PREMIUM_P2"],"effort":"M","license":"Entra ID P2","title_de":"Risikobasierte Anmeldung (Anmelde- und Benutzerrisiko)","title_en":"Risk-based sign-in (sign-in and user risk)","why_de":"Gestohlene Sitzungen und Passwörter fallen über das Risiko auf. Ohne Regel nutzt ein Angreifer Copilot mit dem Konto weiter, als wäre nichts passiert.","why_en":"Stolen sessions and passwords show up as risk. Without a rule an attacker keeps using Copilot with the account as if nothing happened.","fix_de":"CA-Richtlinien: mittleres und hohes Anmelderisiko verlangt starke MFA, hohes Benutzerrisiko verlangt sichere Passwortänderung oder Sperre.","fix_en":"CA policies: medium and high sign-in risk requires strong MFA, high user risk requires a secure password change or block.","path":"Entra Admin Center → Protection → Conditional Access","docs":"https://learn.microsoft.com/entra/identity/conditional-access/policy-risk-based-sign-in","source":"GET /identity/conditionalAccess/policies (signInRiskLevels, userRiskLevels)"},{"id":"I02","area":"identity","weight":3,"scored":true,"reader":"graph","scopes":["Policy.Read.All"],"plans":["AAD_PREMIUM","AAD_PREMIUM_P2"],"effort":"M","license":"Entra ID P1","title_de":"Phishing-resistente MFA für Admins","title_en":"Phishing-resistant MFA for admins","why_de":"Admins steuern Copilot, Agents und Berechtigungen. Ein Admin-Konto, das per Phishing-Proxy übernommen wird, öffnet den ganzen Tenant.","why_en":"Admins control Copilot, agents and permissions. An admin account taken over through a phishing proxy opens the whole tenant.","fix_de":"CA-Richtlinie für Admin-Rollen mit Authentifizierungsstärke „Phishing-resistente MFA“ (FIDO2, Passkey, Windows Hello, CBA).","fix_en":"CA policy for admin roles with the authentication strength Phishing-resistant MFA (FIDO2, passkey, Windows Hello, CBA).","path":"Entra Admin Center → Protection → Conditional Access","docs":"https://learn.microsoft.com/entra/identity/conditional-access/policy-admin-phish-resistant-mfa","source":"GET /identity/conditionalAccess/policies (includeRoles, authenticationStrength)"},{"id":"I03","area":"identity","weight":2,"scored":true,"reader":"graph","scopes":["Directory.Read.All"],"effort":"M","license":"—","title_de":"Apps und Agents mit weitreichenden Rechten","title_en":"Apps and agents with far-reaching permissions","why_de":"Apps mit Rechten wie Mail.Read oder Files.Read.All für alle Nutzer lesen dieselben Daten wie Copilot, aber ohne dessen Schutz. Das ist der Seitenkanal an Ihrer KI-Steuerung vorbei.","why_en":"Apps holding permissions such as Mail.Read or Files.Read.All for all users read the same data as Copilot, but without its protection. That is the side channel around your AI governance.","fix_de":"Gelistete Freigaben prüfen. Nicht benötigte Zustimmungen entfernen, für den Rest einen Owner festlegen.","fix_en":"Review the listed grants. Remove consents you do not need and set an owner for the rest.","path":"Entra Admin Center → Enterprise applications → Permissions","docs":"https://learn.microsoft.com/entra/identity/enterprise-apps/manage-application-permissions","source":"GET /oauth2PermissionGrants · GET /servicePrincipals/{id}/appRoleAssignedTo (Microsoft Graph)"},{"id":"I04","area":"identity","weight":2,"scored":true,"reader":"graph","scopes":["RoleManagement.Read.Directory"],"plans":["AAD_PREMIUM_P2"],"effort":"M","license":"Entra ID P2 (PIM)","title_de":"Admin-Rollen: dauerhaft aktiv oder nur berechtigt (PIM)","title_en":"Admin roles: permanently active or eligible only (PIM)","why_de":"Dauerhaft aktive Admin-Rollen sind jederzeit nutzbar, auch für Angreifer. Mit PIM werden Rechte nur bei Bedarf und protokolliert aktiviert.","why_en":"Permanently active admin roles can be used at any time, by attackers too. With PIM rights are activated only when needed, and logged.","fix_de":"Privilegierte Rollen als „berechtigt“ zuweisen und Aktivierung mit MFA und Begründung verlangen.","fix_en":"Assign privileged roles as eligible and require MFA and a reason for activation.","path":"Entra Admin Center → Identity Governance → Privileged Identity Management","docs":"https://learn.microsoft.com/entra/id-governance/privileged-identity-management/pim-configure","source":"GET /roleManagement/directory/roleAssignmentScheduleInstances · /roleEligibilityScheduleInstances"},{"id":"S10","area":"defender","weight":1,"scored":true,"reader":"graph","scopes":["SecurityEvents.Read.All"],"effort":"M","license":"—","title_de":"Secure Score: offene Daten- und Identitäts-Maßnahmen","title_en":"Secure Score: open data and identity actions","why_de":"Microsofts eigene Bewertung. Die offenen Maßnahmen zu Daten, Apps und Identität sind die, die für KI zählen.","why_en":"Microsoft's own rating. The open actions on data, apps and identity are the ones that matter for AI.","fix_de":"Die gelisteten Maßnahmen nach Punkten abarbeiten.","fix_en":"Work through the listed actions by points.","path":"Defender Portal → Exposure management → Secure Score","docs":"https://learn.microsoft.com/defender-xdr/microsoft-secure-score","source":"GET /security/secureScores · GET /security/secureScoreControlProfiles"},{"id":"D01","area":"defender","weight":1,"scored":false,"reader":"manual","scopes":[],"effort":"M","license":"Defender for Cloud Apps","title_de":"Schatten-KI: genutzte KI-Dienste (Prüfung im Portal)","title_en":"Shadow AI: AI services in use (check in the portal)","why_de":"Mitarbeitende nutzen KI-Dienste außerhalb von Copilot. Das zeigt keine Lizenzliste, nur die Cloud-Discovery in Defender for Cloud Apps.","why_en":"Staff use AI services outside Copilot. No licence list shows this, only cloud discovery in Defender for Cloud Apps.","fix_de":"In Defender for Cloud Apps die Kategorie „Generative AI“ prüfen und nicht freigegebene Dienste sperren. Dieses Tool liest das in v1 nicht.","fix_en":"Check the Generative AI category in Defender for Cloud Apps and block unsanctioned services. This tool does not read it in v1.","path":"Defender Portal → Cloud apps → Cloud app catalog → Generative AI","docs":"https://learn.microsoft.com/security/security-for-ai/discover","source":"— (portal; optional collector planned)"},{"id":"N01","area":"audit","weight":3,"scored":true,"reader":"graph","scopes":["AuditLogsQuery.Read.All"],"effort":"S","license":"— (Audit Standard)","title_de":"Audit-Log durchsuchbar","title_en":"Audit log searchable","why_de":"Ohne Audit-Log gibt es keinen Beleg, wer Copilot oder einen Agent wann mit welchen Daten genutzt hat.","why_en":"Without the audit log there is no record of who used Copilot or an agent, when, and with which data.","fix_de":"Audit im Purview-Portal einschalten und prüfen, dass Suchen abgeschlossen werden.","fix_en":"Turn on auditing in the Purview portal and check that searches complete.","path":"Purview → Audit","docs":"https://learn.microsoft.com/purview/audit-log-enable-disable","source":"POST beta/security/auditLog/queries (one saved search, see README) · GET .../queries/{id}"},{"id":"N02","area":"audit","weight":2,"scored":true,"reader":"graph","scopes":["AuditLogsQuery.Read.All"],"effort":"S","license":"— (Audit Standard)","title_de":"Copilot-Interaktionen im Audit-Log","title_en":"Copilot interactions in the audit log","why_de":"Der Beleg, dass Copilot- und Agent-Nutzung tatsächlich protokolliert wird, je App und Nutzer. Prompt-Inhalte liest das Tool nicht.","why_en":"The proof that Copilot and agent use is really logged, per app and user. The tool does not read prompt content.","fix_de":"Eine regelmäßige Audit-Suche nach „CopilotInteraction“ in den Betrieb aufnehmen.","fix_en":"Add a regular audit search for CopilotInteraction to operations.","path":"Purview → Audit → Search","docs":"https://learn.microsoft.com/purview/audit-copilot","source":"GET beta/security/auditLog/queries/{id}/records"},{"id":"N03","area":"audit","weight":1,"scored":false,"reader":"graph","scopes":["Organization.Read.All"],"effort":"M","license":"Entra ID P1/P2","title_de":"Aufbewahrung der Entra-Logs (Info)","title_en":"Entra log retention (info)","why_de":"Die eingebaute Aufbewahrung von 7 oder 30 Tagen ist für die Aufklärung von Vorfällen meist zu kurz. Ob Logs exportiert werden, liest dieses Tool nicht.","why_en":"Built-in retention of 7 or 30 days is usually too short to investigate incidents. Whether logs are exported is not read by this tool.","fix_de":"Diagnose-Einstellungen nach Log Analytics oder Sentinel, 1 Jahr oder länger.","fix_en":"Diagnostic settings to Log Analytics or Sentinel, one year or longer.","path":"Entra Admin Center → Monitoring → Diagnostic settings","docs":"https://learn.microsoft.com/entra/identity/monitoring-health/howto-integrate-activity-logs-with-azure-monitor-logs","source":"GET /subscribedSkus (licence-based retention only)"},{"id":"B03","area":"audit","weight":2,"scored":true,"reader":"purview","scopes":[],"effort":"M","license":"Microsoft 365 E3/E5 + Copilot","title_de":"Aufbewahrung für Copilot-Interaktionen","title_en":"Retention for Copilot interactions","why_de":"Prompts und Antworten sind Unternehmensdaten. Sie brauchen eine Regel, wie lange sie bleiben oder wann sie gelöscht werden.","why_en":"Prompts and answers are company data. They need a rule for how long they stay or when they are deleted.","fix_de":"Aufbewahrungsrichtlinie mit Speicherort für
