, state, score, message, evidence). Not a signature.","de":"Prüfsumme (SHA-256) nur über die Check-Ergebnisse (ID, Status, Score, Meldung, Nachweis). Keine Signatur."},"method":{"en":"Scoring: weighted score (weight 1 to 3) over checks rated OK, Review or Act. Coverage = assessed weight / weight of all applicable scored checks. Grey states never count as a pass.","de":"Bewertung: gewichteter Score (Gewicht 1 bis 3) über Checks mit OK, Prüfen oder Handeln. Abdeckung = bewertetes Gewicht / Gewicht aller zutreffenden bewerteten Checks. Graue Zustände zählen nie als bestanden."},"footer":{"en":"Need help? govnex.de","de":"Unterstützung gewünscht? govnex.de"},"credit":{"en":"Free and open source, by","de":"Kostenlos und quelloffen, von"},"toTop":{"en":"Back to top","de":"Nach oben"},"disclosure.title":{"en":"Before you sign in — what this tool does and does not do","de":"Vor der Anmeldung — was dieses Tool tut und was nicht"},"disclosure.readonly":{"en":"Read-only. It requests read permissions only ('.Read'), and the code can call no other kind. Nothing in your tenant is changed, enabled, deleted or configured.","de":"Nur lesend. Es werden ausschließlich Leseberechtigungen angefragt ('.Read'), andere kann der Code nicht aufrufen. In Ihrem Tenant wird nichts geändert, aktiviert, gelöscht oder konfiguriert."},"disclosure.account":{"en":"It acts only as you. The sign-in is delegated: the tool sees exactly what your own account may see, nothing more. No app registration is created, no client secret is used, no background service keeps running afterwards.","de":"Es handelt ausschließlich in Ihrem Namen. Die Anmeldung ist delegiert: Das Tool sieht genau das, was Ihr eigenes Konto sehen darf — nicht mehr. Es wird keine App-Registrierung angelegt, kein Client Secret verwendet, und nach dem Lauf bleibt kein Dienst zurück."},"disclosure.local":{"en":"Your data stays on this PC. The report and the JSON file are written to the out\\ folder on this machine. Nothing is uploaded, no telemetry is sent, and govnex never sees your results.","de":"Ihre Daten bleiben auf diesem PC. Bericht und JSON-Datei werden in den Ordner out\\ auf diesem Rechner geschrieben. Es wird nichts hochgeladen, keine Telemetrie gesendet, und govnex sieht Ihre Ergebnisse nie."},"disclosure.creates":{"en":"One object is created: a Purview audit search (a saved search) for Copilot interactions of the last 7 days, needed by checks N01 and N02. Nothing else. Reuse an existing one with -AuditQueryId.","de":"Angelegt wird genau ein Objekt: eine Purview-Audit-Suche (gespeicherte Suche) nach Copilot-Interaktionen der letzten 7 Tage, benötigt von den Checks N01 und N02. Sonst nichts. Eine bestehende Suche wiederverwenden: -AuditQueryId."},"disclosure.reads":{"en":"What it reads: tenant and licence information, sharing settings, groups and sites, guests, sensitivity and retention labels, Conditional Access and admin roles, app permissions, Secure Score and the audit configuration. The report lists every single read with its result.","de":"Was gelesen wird: Tenant- und Lizenzinformationen, Freigabe-Einstellungen, Gruppen und Sites, Gäste, Vertraulichkeits- und Aufbewahrungslabels, Conditional Access und Admin-Rollen, App-Berechtigungen, Secure Score und die Audit-Konfiguration. Der Bericht weist jeden einzelnen Lesezugriff mit Ergebnis aus."},"disclosure.revoke":{"en":"You stay in control. The sign-in uses Microsoft's own 'Graph Command Line Tools' app. Withdraw it any time in Entra: Enterprise applications > Microsoft Graph Command Line Tools > Permissions. -Logout deletes the saved sign-in on this PC.","de":"Sie behalten die Kontrolle. Die Anmeldung läuft über Microsofts eigene App 'Graph Command Line Tools'. Sie können die Zustimmung jederzeit in Entra entziehen: Unternehmensanwendungen > Microsoft Graph Command Line Tools > Berechtigungen. -Logout löscht die gespeicherte Anmeldung auf diesem PC."},"disclosure.source":{"en":"The source code is open (MIT). Every permission, every read and every result state is documented in README.md.","de":"Der Quellcode ist offen (MIT). Jede Berechtigung, jeder Lesezugriff und jeder Ergebniszustand ist in README.md dokumentiert."},"disclosure.continue":{"en":"Press Enter to sign in, or Ctrl+C to stop. (-Yes skips this page.)","de":"Enter zum Anmelden, Strg+C zum Abbrechen. (-Yes überspringt diese Seite.)"},"disclosure.scopes":{"en":"Permissions that will be requested","de":"Berechtigungen, die angefragt werden"},"tenantConfirm.title":{"en":"Is this the right tenant?","de":"Ist das der richtige Tenant?"},"tenantConfirm.continue":{"en":"Press Enter to check this tenant, or Ctrl+C to stop and sign in with another account.","de":"Enter, um diesen Tenant zu prüfen, oder Strg+C zum Abbrechen und mit einem anderen Konto anzumelden."},"console.signIn":{"en":"Sign in in the browser window that just opened, then come back here.","de":"Melden Sie sich im Browserfenster an, das sich gerade geöffnet hat, und kommen Sie dann hierher zurück."},"console.noWindow":{"en":"If no window appears, open this link yourself:","de":"Öffnet sich kein Fenster, rufen Sie diesen Link selbst auf:"},"console.savedSession":{"en":"Signed in from the saved session, no window needed (-Logout forgets it).","de":"Mit der gespeicherten Anmeldung angemeldet, kein Fenster nötig (-Logout vergisst sie)."},"enum.everyone":{"en":"everyone, including guests","de":"alle, auch Gäste"},"enum.adminsGuestInvitersAndAllMembers":{"en":"all members","de":"alle Mitglieder"},"enum.adminsAndGuestInviters":{"en":"admins and guest inviters only","de":"nur Admins und Gasteinladende"},"enum.none":{"en":"nobody","de":"niemand"},"enum.member":{"en":"same as members","de":"wie Mitglieder"},"enum.limited":{"en":"limited (default)","de":"eingeschränkt (Standard)"},"enum.restricted":{"en":"restricted","de":"stark eingeschränkt"},"enum.tenant":{"en":"tenant catalogue","de":"Tenant-Katalog"},"enum.user":{"en":"signed-in user only","de":"nur angemeldeter Nutzer"},"console.scopeFallback":{"en":"Some newer permissions are not available in this tenant; signing in with the core set. Affected checks will show \"no permission\".","de":"Einige neuere Berechtigungen gibt es in diesem Tenant nicht; Anmeldung mit dem Kernsatz. Betroffene Checks zeigen „Keine Berechtigung“."},"console.nonInteractive":{"en":"This window cannot ask for confirmation (no interactive console). Read the page above, then start the tool again with -Yes for unattended runs.","de":"Dieses Fenster kann keine Bestätigung abfragen (keine interaktive Konsole). Lesen Sie die Seite oben und starten Sie das Tool für unbeaufsichtigte Läufe erneut mit -Yes."},"console.loggedOutTenant":{"en":"Saved sign-in for this tenant deleted. Sign-ins for other tenants are kept.","de":"Gespeicherte Anmeldung für diesen Tenant gelöscht. Anmeldungen für andere Tenants bleiben erhalten."},"console.loggedOutAll":{"en":"All saved sign-ins deleted. The next run opens a browser window again.","de":"Alle gespeicherten Anmeldungen gelöscht. Der nächste Lauf öffnet wieder ein Browserfenster."},"console.noSavedSignIn":{"en":"No saved sign-in found.","de":"Keine gespeicherte Anmeldung gefunden."},"console.noCachePlatform":{"en":"Sign-ins are never saved on this platform (DPAPI is Windows only).","de":"Auf dieser Plattform werden Anmeldungen nie gespeichert (DPAPI gibt es nur unter Windows)."},"console.browserFallback":{"en":"Browser sign-in did not work ({why}). Falling back to the device code.","de":"Die Anmeldung im Browser hat nicht geklappt ({why}). Weiter mit dem Gerätecode."},"console.savedInvalid":{"en":"The saved sign-in is no longer valid; signing in again.","de":"Die gespeicherte Anmeldung ist nicht mehr gültig; neue Anmeldung."},"console.tenant":{"en":"Tenant:","de":"Tenant:"},"console.domain":{"en":"Domain:","de":"Domain:"},"console.id":{"en":"Id:","de":"ID:"},"console.account":{"en":"Account:","de":"Konto:"},"console.preflight":{"en":"Preflight","de":"Vorprüfung"},"console.roles":{"en":"Account roles:","de":"Rollen des Kontos:"},"console.noneFound":{"en":"(none found)","de":"(keine gefunden)"},"console.copilotLicence":{"en":"Copilot licence:","de":"Copilot-Lizenz:"},"console.unknown":{"en":"unknown","de":"unbekannt"},"console.run":{"en":"run","de":"läuft"},"console.skipped":{"en":"skip","de":"ausgelassen"},"console.needDeep":{"en":"{n} check(s) need the newer read permissions ({ids}): run once with -Deep to consent.","de":"{n} Check(s) brauchen die neueren Leseberechtigungen ({ids}): einmal mit -Deep ausführen und zustimmen."},"console.auditSubmitted":{"en":"Audit search for Copilot interactions submitted ({id}); the result is collected at the end.","de":"Audit-Suche nach Copilot-Interaktionen gestartet ({id}); das Ergebnis wird am Ende abgeholt."},"console.score":{"en":"Score of assessed checks:","de":"Score der bewerteten Checks:"},"console.coverage":{"en":"coverage:","de":"Abdeckung:"},"console.verdict":{"en":"verdict:","de":"Urteil:"},"console.report":{"en":"Report:","de":"Bericht:"},"console.data":{"en":"Data:","de":"Daten:"},"console.keepLocal":{"en":"(contains names and UPNs; keep it on this PC)","de":"(enthält Namen und UPNs; bleibt auf diesem PC)"}}}};

let lang = P.lang || 'de';
try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'de' || q === 'en') lang = q; } catch (e) {}
const I = P.i18n, D = P.data, C = P.catalog;
const u = k => ((I.ui[k] || {})[lang]) ?? k;
const loc = () => lang === 'de' ? 'de-DE' : 'en-GB';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    // "426 s" means nothing to a reader; a run that waits for the audit search takes minutes.
    const fmtDuration = s => {
      const t = Math.max(0, Math.round(Number(s) || 0));
      if (t < 60) return `${t} ${u('unit.sec')}`;
      const m = Math.floor(t / 60), r = t % 60;
      return r ? `${m} ${u('unit.min')} ${r} ${u('unit.sec')}` : `${m} ${u('unit.min')}`;
    };
const fmtNum = v => typeof v === 'number' ? v.toLocaleString(loc(), {maximumFractionDigits: 1}) : v;
// Readable words instead of raw values ("Namen verborgen: ja", "alle Mitglieder", "OK"), same rule as Format-CrMessage.
const word = v => { if (typeof v !== 'string') return v; for (const k of [(v === 'yes' || v === 'no' || v === 'unknown') ? v : null, 'enum.' + v, 'state.' + v]) { if (k && I.ui[k]) return I.ui[k][lang] || v; } return v; };
const fill = (tpl, a) => String(tpl).replace(/\{(\w+)\}/g, (m, k) => a && k in a && a[k] !== null && a[k] !== undefined ? esc(fmtNum(word(a[k]))) : m);
const msg = r => { const t = r && r.Msg && I.messages[r.Msg]; return t ? fill(t[lang], r.Args || {}) : esc(r && r.Summary || ''); };
const col = k => ((I.columns[k] || {})[lang]) ?? k;
const byId = Object.fromEntries(C.checks.map(c => [c.id, c]));
const res = Object.fromEntries(D.results.map(r => [r.Id, r]));
const area = k => D.scores.areas.find(a => a.key === k) || {};
const checksOf = k => C.checks.filter(c => c.area === k);
const SCORED = ['Pass', 'Warn', 'Fail'];
const GREY = ['NotLicensed', 'NoPermission', 'Manual', 'Unknown', 'NotApplicable', 'Info'];
const tone = s => s == null ? 'na' : s >= P.scoring.good ? 'good' : s >= P.scoring.warn ? 'warn' : 'crit';
const stTone = st => ({Pass:'good', Warn:'warn', Fail:'crit'})[st] || 'na';
const icon = k => ({good:'✓', warn:'!', crit:'✕', na:'–'})[k];
const pill = st => `<span class="pill p-${stTone(st)}" title="${esc(u('stateHelp.' + st) === 'stateHelp.' + st ? '' : u('stateHelp.' + st))}"><i>${icon(stTone(st))}</i>${esc(u('state.' + st))}</span>`;
let filter = 'All', query = '';
const openState = {}, showAll = {};
const isOpen = id => openState[id] ?? ['Fail', 'Warn'].includes((res[id] || {}).State);

function meter(v, cls) { return `<div class="meter ${cls || 's-' + tone(v)}"><i style="width:${v == null ? 0 : Math.max(v, v > 0 ? 2 : 0)}%"></i></div>`; }
function stack(rs) {
  const c = {good:0, warn:0, crit:0, na:0}; rs.forEach(r => c[stTone(r.State)]++);
  const n = rs.length || 1;
  return `<div class="stack">${['good','warn','crit','na'].filter(k => c[k]).map(k => `<i class="sg-${k}" style="width:${(100 * c[k] / n).toFixed(1)}%"></i>`).join('')}</div>`;
}
function ring(v, t) {
  const r = 62, c = 2 * Math.PI * r, o = v == null ? c : c * (1 - v / 100);
  return `<div class="ringwrap"><svg class="ring s-${t}" width="156" height="156" viewBox="0 0 156 156" role="img" aria-label="${v == null ? '–' : v + ' %'}"><circle class="track" cx="78" cy="78" r="${r}"/><circle class="fill" cx="78" cy="78" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${o.toFixed(1)}"/></svg><div class="v"><b>${v == null ? '–' : v + '%'}</b><small>${esc(u('overall'))}</small></div></div>`;
}

// ---------- evidence ----------
const goodTrue = new Set(['OK','Covered','Enabled','Active','Effective','DefaultLabel','Mandatory','ExcludesProcessing','Present','Container','RAC','Required']);
const badTrue = new Set(['Disabled','CopilotLicence','EntireTenant','MakerConnection','RuleDisabled']);
const ISO = /^(\d{4})-(\d{2})-(\d{2})(T[\d:.]+Z?)?$/;
function cell(k, v) {
  if (v == null || v === '') return '<span class="dim">—</span>';
  if (typeof v === 'boolean') {
    const g = goodTrue.has(k) ? v : badTrue.has(k) ? !v : null;
    return `<span class="b ${g == null ? 'plain' : g ? 'good' : 'crit'}"><i>${v ? '✓' : '✕'}</i>${esc(u(v ? 'yes' : 'no'))}</span>`;
  }
  if (typeof v === 'number') return fmtNum(v);
  if (typeof v === 'object') return `<span class="mono">${esc(JSON.stringify(v))}</span>`;
  const s = String(v);
  if (ISO.test(s)) return `<span class="nowrap">${new Date(s.length === 10 ? s + 'T00:00:00Z' : s).toLocaleDateString(loc(), {day:'2-digit', month:'2-digit', year:'numeric'})}</span>`;
  if (/^https?:\/\//.test(s)) return `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s.replace(/^https?:\/\//, ''))}</a>`;
  if (s.length > 160) return `<details class="ids"><summary>${esc(s.slice(0, 120))}…</summary><div class="mono">${esc(s)}</div></details>`;
  return esc(s);
}
function evidence(r, id) {
  const ev = (r.Evidence || []).filter(x => x && typeof x === 'object');
  if (!ev.length) return `<div class="evh"><span class="k">${esc(u('evidence'))}</span></div><div class="noev">${esc(u('noEvidence'))}</div>`;
  const cols = [...new Set(ev.flatMap(o => Object.keys(o)))];
  const numeric = Object.fromEntries(cols.map(k => [k, ev.every(o => o[k] == null || typeof o[k] === 'number')]));
  const limit = 12, cut = ev.length > limit && !showAll[id];
  const rows = (cut ? ev.slice(0, limit) : ev).map(o => {
    const bad = o.OK === false || o.Covered === false || o.Effective === false || (o.Issues && o.Issues.length > 0) || o.Coverage === 'partial';
    return `<tr class="${bad ? 'bad' : ''}">${cols.map(k => `<td class="${numeric[k] ? 'n' : ''}">${cell(k, o[k])}</td>`).join('')}</tr>`;
  }).join('');
  return `<div class="evh"><span class="k">${esc(u('evidence'))}</span><small>${ev.length} ${esc(u('rows'))}</small></div>
    <div class="tw"><table><thead><tr>${cols.map(k => `<th class="${numeric[k] ? 'n' : ''}">${esc(col(k))}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    ${cut ? `<button class="btn link" onclick="showAll['${id}']=true;render()">${esc(u('showAll'))} (${ev.length}) ↓</button>` : ''}`;
}

// ---------- render ----------
function render() {
  document.documentElement.lang = lang;
  document.title = P.product.name;
  const all = C.checks.map(c => res[c.id]).filter(Boolean);
  const n = st => all.filter(r => r.State === st).length;
  const ov = D.scores.overall, tn = D.tenant;

  // The report belongs to the tenant it describes: the organisation is the headline, the product is
  // the subtitle. The run id is technical and lives in the footer, not next to the company name.
  document.getElementById('h1').textContent = tn.name || u('tenant');
  document.getElementById('logo').textContent = P.product.short || 'CA';
  document.getElementById('tagline').textContent = `${P.product.name} · ${u('tagline')}`;
  document.getElementById('meta').innerHTML = [
    `${esc(u('tenant'))}: <b>${esc(tn.domain || '')}</b>`,
    `${esc(u('generated'))}: <b>${new Date(D.generated).toLocaleString(loc(), {dateStyle:'medium', timeStyle:'short'})}</b>`,
    `${esc(u('mode'))}: <b>${esc(tn.mode)}</b>${tn.account ? ` · ${esc(tn.account)}` : ''}`,
    `${esc(u('duration'))}: <b>${fmtDuration(D.durationSec)}</b> · v${esc(D.version)}`
  ].map(x => `<span>${x}</span>`).join('');
  const th = document.documentElement.dataset.theme || 'auto';
  document.getElementById('actions').innerHTML =
    `<div class="seg"><button class="${lang === 'de' ? 'on' : ''}" onclick="setLang('de')">DE</button><button class="${lang === 'en' ? 'on' : ''}" onclick="setLang('en')">EN</button></div>` +
    `<div class="seg">${['auto','light','dark'].map(k => `<button class="${th === k ? 'on' : ''}" onclick="setTheme('${k}')">${esc(u('theme.' + k))}</button>`).join('')}</div>` +
    `<button class="btn" onclick="window.print()">${esc(u('print'))}</button>`;

  // notes: demo / partial run / local data / what was created
  document.getElementById('notes').innerHTML =
    (D.demo ? `<div class="note strong">ⓘ <span>${esc(u('demo'))}</span></div>` : '') +
    (D.partialRun ? `<div class="note strong">ⓘ <span>${esc(u('partial'))}</span></div>` : '') +
    `<div class="note">🔒 <span>${esc(u('localData'))} ${esc(u('createdNote'))}</span></div>`;

  // overall
  const incomplete = ov.verdict === 'incomplete' || ov.verdict === 'none';
  const vt = incomplete ? 'na' : ov.verdict;
  const sub = incomplete
    ? fill(u('verdictSub.incomplete'), {coverage: ov.coverage, min: ov.minCoverage, minArea: ov.minAreaCoverage})
    : fill(u('verdictSub.scored'), {fail: n('Fail'), warn: n('Warn'), coverage: ov.coverage});
  document.getElementById('overall').innerHTML = ring(ov.score, incomplete ? 'na' : tone(ov.score)) +
    `<div class="verdict tone-${vt}"><span class="dot d-${vt}" style="width:12px;height:12px"></span>${esc(u('verdict.' + ov.verdict))}</div>` +
    `<div class="cov">${meter(ov.coverage, 's-cov')}<div class="covline"><span>${esc(u('coverage'))}</span><b>${ov.coverage} %</b></div></div>` +
    `<p>${sub}</p>` +
    `<div class="statecount">${['Pass','Warn','Fail'].concat(GREY).filter(st => n(st)).map(st => `<span class="clk" onclick="filterTo('${SCORED.includes(st) ? st : 'Grey'}')"><span class="dot d-${stTone(st)}"></span>${esc(u('state.' + st))} <b>${n(st)}</b></span>`).join('')}</div>`;

  // areas
  document.getElementById('ladder').innerHTML =
    `<div class="head"><div><h2>${esc(u('areas'))}</h2><p>${esc(u('areasSub'))}</p></div></div>` +
    C.areas.map(a => {
      const sc = area(a.key), rs = checksOf(a.key).map(c => res[c.id]).filter(Boolean);
      return `<a class="lrow" href="#a-${a.key}"><div class="n">${a.n}</div><div class="t"><b>${esc(a[lang])}</b><span>${esc(a['sub_' + lang])}</span></div>${meter(sc.score)}<div class="sc">${sc.score == null ? '–' : sc.score + '%'}<small>${esc(u('coverage'))} ${sc.coverage == null ? '–' : sc.coverage + '%'}</small></div><div class="lst">${stack(rs)}<div class="cnt">${['good','warn','crit','na'].map(k => `<span><span class="dot d-${k}"></span><b>${rs.filter(r => stTone(r.State) === k).length}</b></span>`).join('')}</div></div></a>`;
    }).join('');

  // preflight / capabilities
  const pf = D.preflight || {};
  document.getElementById('caps').innerHTML =
    `<div class="sechead"><div><h2>${esc(u('capabilities'))}</h2><p>${esc(u('capabilitiesSub'))}</p></div></div>
     <div class="tw"><table><thead><tr><th></th><th></th><th class="n">${esc(u('ran'))}</th><th class="n">${esc(u('skipped'))}</th><th>${esc(u('detail'))}</th></tr></thead><tbody>
     ${(pf.readers || []).map(r => `<tr><td class="r"><b>${esc(u('reader.' + r.reader))}</b></td><td class="r">${r.connected ? `<span class="b good"><i>✓</i>${esc(u('connected'))}</span>` : `<span class="b plain"><i>–</i>${esc(u('notConnected'))}</span>`}</td><td class="n">${r.run}</td><td class="n">${r.skipped}</td><td>${esc(r.skippedIds || '')}${r.note ? `<div class="dim">${esc(r.note)}</div>` : ''}</td></tr>`).join('')}
     </tbody></table></div>
     <div class="two"><div><div class="k">${esc(u('roles'))}</div><div class="chips">${(pf.roles || []).map(x => `<span>${esc(x)}</span>`).join('') || '<span>—</span>'}</div></div>
     <div><div class="k">${esc(u('licences'))}</div><div class="chips">${(pf.skus || []).map(x => `<span>${esc(x)}</span>`).join('') || '<span>—</span>'}</div></div></div>`;

  // plan 30/60/90
  const pl = D.plan || {};
  document.getElementById('plan').innerHTML = `<div class="sechead"><div><h2>${esc(u('plan'))}</h2><p>${esc(u('planSub'))}</p></div></div><div class="plancols">${['d30','d60','d90','gaps','licence'].map(k => {
      const items = pl[k] || [];
      return `<div class="card pcol"><h3>${esc(u('plan.' + k))}<span>${items.length}</span></h3>${items.length ? items.map(it => { const c = byId[it.id]; return `<div class="pitem" onclick="show('${it.id}')"><div class="pt">${pill(it.state)}<code>${it.id}</code></div><div class="pt">${esc(c['title_' + lang])}</div><div class="pm">${k === 'gaps' || k === 'licence' ? msg(res[it.id]) : esc(c['fix_' + lang])}${it.effort ? ` · ${esc(u('effort'))}: ${esc(u('effort.' + it.effort))}` : ''}</div></div>`; }).join('') : `<div class="dim" style="font-size:12.5px;padding:4px 2px 8px">${esc(u('plan.empty'))}</div>`}</div>`;
    }).join('')}</div>`;

  // filters
  document.getElementById('filters').innerHTML =
    `<input type="search" id="q" placeholder="${esc(u('search'))}" value="${esc(query)}" oninput="query=this.value;applyFilter()">` +
    [['All', u('filter.all')], ['Fail', u('state.Fail')], ['Warn', u('state.Warn')], ['Pass', u('state.Pass')], ['Grey', u('filter.grey')]].map(([k, l]) => `<button class="btn fbtn" data-f="${k}" onclick="filter='${k}';applyFilter()">${esc(l)}</button>`).join('') +
    `<span class="sp"></span><button class="btn" onclick="toggleAll(true)">${esc(u('expand'))}</button><button class="btn" onclick="toggleAll(false)">${esc(u('collapse'))}</button>`;

  // sections
  document.getElementById('sections').innerHTML = C.areas.map(a => {
    const sc = area(a.key), cs = checksOf(a.key), rs = cs.map(c => res[c.id]).filter(Boolean);
    const cards = cs.filter(c => res[c.id]).map(c => {
      const r = res[c.id];
      const text = [c.id, c.title_de, c.title_en, r.Summary, msg(r), JSON.stringify(r.Evidence || [])].join(' ').toLowerCase();
      const path = (c.path || '').split('→').map(s => s.trim()).filter(Boolean);
      const scored = SCORED.includes(r.State);
      return `<div class="card check ${isOpen(c.id) ? 'open' : ''}" id="r${c.id}" data-state="${r.State}" data-text="${esc(text)}">
        <div class="head" onclick="toggle('${c.id}')">
          ${pill(r.State)}
          <div><div class="ttl"><code>${c.id}</code>${esc(c['title_' + lang])}<span class="tags"><span class="tag" title="${esc(u('weight'))}">${'●'.repeat(c.weight)}${'○'.repeat(3 - c.weight)}</span>${c.scored === false ? `<span class="tag uns">${esc(u('unscored'))}</span>` : ''}${c.preview ? `<span class="tag prev">${esc(u('preview'))}</span>` : ''}${c.license && c.license !== '—' ? `<span class="tag">${esc(c.license)}</span>` : ''}</span></div><div class="sum">${msg(r)}</div></div>
          <div class="side"><div class="msc">${meter(scored ? r.Score : null)}<small>${esc(u('score'))} ${scored ? r.Score : '–'}</small></div><span class="caret">▶</span></div>
        </div>
        <div class="body">
          <div class="two">
            <div class="why"><div class="k">${esc(u('why'))}</div>${esc(c['why_' + lang])}</div>
            <div class="fix"><div class="k">${esc(u('fix'))}</div>${esc(c['fix_' + lang])}
              <div class="path"><em>${esc(u('where'))}</em>${path.map((p, i) => `${i ? '<em>›</em>' : ''}<span>${esc(p)}</span>`).join('')}</div>
              <div class="links"><a href="${esc(c.docs)}" target="_blank" rel="noopener">${esc(u('docs'))} ↗</a>${c.license && c.license !== '—' ? `<span>${esc(u('licence'))}: ${esc((lang === 'en' && c.license_en) || c.license)}</span>` : ''}</div>
            </div>
          </div>
          ${GREY.includes(r.State) ? `<div class="note" style="margin-top:12px">ⓘ <span>${esc(u('stateHelp.' + r.State))}</span></div>` : ''}
          ${evidence(r, c.id)}
          <div class="src">${esc(u('source'))}: <code>${esc(c.source || '')}</code></div>
          ${r.Detail ? `<div class="detail">${esc(r.Detail)}</div>` : ''}
        </div></div>`;
    }).join('');
    return `<section class="area" id="a-${a.key}">
      <div class="card ehead"><div class="badge"><small>${a.n}</small>${esc(a[lang].slice(0, 1))}</div><div><h2>${esc(a[lang])}</h2><div class="sub">${esc(a['sub_' + lang])} · ${rs.filter(r => r.State === 'Pass').length} ${esc(u('of'))} ${rs.length} ${esc(u('checks'))} OK</div></div>
        <div class="right"><div class="sc"><span>${esc(u('score'))}</span><b>${sc.score == null ? '–' : sc.score + '%'}</b></div>${meter(sc.score)}<div class="sc"><span>${esc(u('coverage'))} ${sc.coverage == null ? '–' : sc.coverage + '%'}</span><span>${sc.score == null ? esc(u('noScore')) : ''}</span></div>${meter(sc.coverage, 's-cov')}</div></div>
      ${cards}<div class="nomatch hidden">${esc(u('nomatch'))}</div>
    </section>`;
  }).join('');

  document.getElementById('nav').innerHTML = C.areas.map(a => {
    const sc = area(a.key);
    return `<div class="e"><span>${a.n} · ${esc(a[lang])}</span><b>${sc.score == null ? '–' : sc.score + '%'}</b></div>` +
      checksOf(a.key).filter(c => res[c.id]).map(c => `<a href="#r${c.id}" onclick="show('${c.id}')"><span class="dot d-${stTone(res[c.id].State)}"></span><span class="cid">${c.id}</span><span class="ct">${esc(c['title_' + lang])}</span></a>`).join('');
  }).join('') + `<hr><a href="#plan">→ ${esc(u('plan'))}</a>`;

  document.getElementById('foot').innerHTML = `${esc(u('method'))}<div class="proof">${esc(u('checksum'))} ${esc(D.sha256 || '')}</div><div class="proof">${esc(u('runId'))}: ${esc(D.runId)}</div><div class="dim">${esc(P.product.name)} v${esc(D.version)} · ${all.length} ${esc(u('checks'))}</div>`;
  document.getElementById('help').textContent = u('footer');
  document.getElementById('credit').innerHTML =
    `${esc(u('credit'))} · <a href="https://govnex.de" target="_blank" rel="noopener">govnex.de</a>` +
    ` · <a href="https://www.linkedin.com/in/rashadbakirov" target="_blank" rel="noopener">Rashad Bakirov</a>` +
    ` · © ${new Date(D.generated).getFullYear()} govnex.de`;
  applyFilter();
}

// ---------- interaction ----------
function setLang(l) { lang = l; render(); }
function filterTo(f) { filter = f; applyFilter(); const el = document.getElementById('filters'); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
function toggle(id) { openState[id] = !isOpen(id); document.getElementById('r' + id).classList.toggle('open', openState[id]); }
function toggleAll(open) { C.checks.forEach(c => openState[c.id] = open); document.querySelectorAll('.check').forEach(el => el.classList.toggle('open', open)); }
function show(id) { openState[id] = true; filter = 'All'; applyFilter(); const el = document.getElementById('r' + id); if (!el) return; el.classList.add('open'); setTimeout(() => el.scrollIntoView({behavior:'smooth', block:'start'}), 0); }
function applyFilter() {
  const q = query.trim().toLowerCase();
  document.querySelectorAll('.check').forEach(el => {
    const st = el.dataset.state, grp = SCORED.includes(st) ? st : 'Grey';
    el.classList.toggle('hidden', !((filter === 'All' || grp === filter) && (!q || el.dataset.text.includes(q))));
  });
  document.querySelectorAll('section.area').forEach(s => s.querySelector('.nomatch').classList.toggle('hidden', [...s.querySelectorAll('.check')].some(c => !c.classList.contains('hidden'))));
  document.querySelectorAll('.fbtn').forEach(b => b.classList.toggle('on', b.dataset.f === filter));
}
function setTheme(k) {
  if (k === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = k;
  try { localStorage.setItem('car-theme', k); } catch (e) {}
  render();
}
try { const k = localStorage.getItem('car-theme'); if (k && k !== 'auto') document.documentElement.dataset.theme = k; } catch (e) {}
render();
if (location.hash && location.hash.length > 1) { const el = document.getElementById(location.hash.slice(1)); if (el) setTimeout(() => el.scrollIntoView({block:'start'}), 50); }
</script>
</body>
</html>
